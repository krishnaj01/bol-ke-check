rules:
  - id: PC-GUARANTEE-01
    category: personal_care
    family: guaranteed_results
    title: Guaranteed or absolute result claim
    severity: high
    layer: rule
    patterns:
      - "g[ua]+r[ae]?nt[iy]d? (result|glow|fark|asar|fayda|effect)"
      - "\\b(result|glow|fark|asar) (ki )?g[ua]+r[ae]?nt[iy]"
      - "(100|ek sau|sau) ?(%|percent|pratishat)? ?(result|effect|asar)"
      - "pakka (result|fark|asar|glow)"
      - "गारंटी"
    explanation: Absolute outcome claims need substantiation, and results differ between people.
    suggested_fix: Say results vary and describe your own experience.
    source: "ASCI Code Ch. I cl. 1.1 (substantiation) and cl. 1.5: no claim \"so exaggerated as to lead to grave or widespread disappointment\"."
    verified: true

  - id: PC-TIMEBOUND-01
    category: personal_care
    family: guaranteed_results
    title: Time-bound result claim
    severity: high
    layer: rule
    patterns:
      - "\\b(\\d+|ek|do|teen|char|panch|chhe|sat|aath|das|pandrah) (din|hafte|mahine) me(in)? .{0,40}(glow|gora|gori|baal|result|fark|asar|pimple|dane)"
    explanation: Promising a result within a fixed time needs substantiation.
    suggested_fix: "Apna experience batayein: 'Mujhe kuch hafton mein fark laga, aapke results alag ho sakte hain.'"
    source: "ASCI Code Ch. I cl. 1.1: claims of \"objectively ascertainable fact, should be capable of substantiation\"."
    verified: true

  - id: PC-INSTANT-01
    category: personal_care
    family: guaranteed_results
    title: Instant or overnight result claim
    severity: high
    layer: rule
    patterns:
      - "\\binstant (glow|result|gora|fair|whitening)"
      - "\\bturant (asar|result|gora|glow|fark)"
      - "\\bovernight (glow|result|fark)"
      - "\\bek raat me(in)?\\b"
    explanation: An instant-result claim needs substantiation, and results differ between people.
    suggested_fix: Describe a realistic routine and timeline, and say that results vary.
    source: "ASCI Code Ch. I cl. 1.1 (substantiation) and cl. 1.5 on exaggerated claims."
    verified: true

  - id: PC-FAIRNESS-01
    category: personal_care
    family: guaranteed_results
    title: Skin-lightening result claim
    severity: medium
    layer: rule
    patterns:
      - "\\bgor[ai] (ban|ho) ?(ja|de|gi|ge|ga)"
      - "\\brang saaf\\b"
    explanation: Claims about changing skin tone are a sensitive and high-risk area.
    suggested_fix: Talk about skin feel or hydration rather than a change in skin tone.
    source: "Partial: ASCI Skin Lightening or Fairness Guidelines restrict portraying darker skin as inferior. They do not ban claims about changing skin tone, which this rule flags; such claims still need substantiation under Code cl. 1.1."
    verified: false
