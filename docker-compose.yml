services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/bolkecheck.db
      MEDIA_DIR: /media-store
    volumes:
      - ./media:/media-store
      - db:/data
    ports:
      - "8000:8000"

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"
    environment:
      VITE_PROXY_TARGET: http://backend:8000
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db:
