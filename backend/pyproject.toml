[project]
name = "bol-ke-check-backend"
version = "0.1.0"
description = "Pre-publish compliance checker for spoken Hinglish claims in creator reels"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "openai>=1.40",
    "tenacity>=9.0",
    "sse-starlette>=2.1",
    "python-ulid>=2.7",
    "pyyaml>=6.0",
    "webrtcvad-wheels>=2.0.14",
    "setuptools<81",
    "imageio-ffmpeg>=0.5",
    "indic-transliteration>=2.3",
    "num2words>=0.5.13",
    "numpy>=1.26",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
